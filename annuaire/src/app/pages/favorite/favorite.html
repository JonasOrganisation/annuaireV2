<app-async-state [loading]="loading()" [error]="error()" loadingText="Chargement du catalogue…">
  <section class="card-list">
    @for (p of favoritePeople(); track p.login.uuid) {
      <!-- <p>{{ p.name.first }}</p> -->
      <app-person-card
        [person]="p"
        (toggleFavorite)="favorites.addFav($event.login.uuid)"
        [favorite]="true"
      />
    } @empty {
      <p>Aucun Favoris pour le moment !</p>
    }
  </section>
</app-async-state>
