<article class="card">
  <button
    matIconButton
    type="button"
    class="star"
    aria-label="Favori"
    [attr.aria-pressed]="favorite()"
    (click)="toggleFavorite.emit(person())"
  >
    {{ favorite() ? '★' : '☆' }}
  </button>
  <img
    class="card__avatar"
    [src]="person().picture.medium"
    alt="${{ person().name.first }} +''¨${{ person().name.last }}"
    width="96"
    height="96"
  />
  <h3 class="card__name">{{ person().name.first }} {{ person().name.last }}</h3>
  <p class="card__location">{{ person().location.city }}</p>

  <a [routerLink]="['/personnes', person().login.uuid]">Lien de la card</a>
</article>
