<p>Liste de personnes:</p>
<app-async-state [loading]="loading()" [error]="error()" loadingText="Chargement du catalogue…">
  <section class="card-list">
    @for (p of people(); track p.login.uuid) {
      <a [routerLink]="['/personnes', p.login.uuid]">
        <!-- <p>{{ p.name.first }}</p> -->
        <app-person-card [person]="p" />
      </a>
    } @empty {
      <p>Annuaire indisponible !</p>
    }
  </section>
</app-async-state>
